<!--
HTML is the standard markup language for
creating Web pages.It stands for Hyper Text Markup Language,
it describes the structure of a Web page|
it consists of a series of elements,
the elements tell the browser how to display the content
HTML elements label pieces of content such as 
"this is a heading", "this is a paragraph", "this is a link", etc.
-->

<!-- An HTML element is defined by a start tag, some content, and an end tag: 
<tagname> Content goes here... </tagname> 
--> 

<!-- 
Some HTML elements have no content (like the <br> element).
These elements are called empty elements.
Empty elements do not have an end tag!
-->

<!DOCTYPE html> <!-- this declaration defines that this document is an HTML5 document-->

<html> <!--this element is the root element of an HTML page-->
<head> <!--this element contains meta info about the HTML page-->
    <title> firstwebpage </title>
<!-- <link rel="style" href="style.css"> -->
</head>

<body style="background-color:darkslateblue ;"> 
<!--
 HTML headings are defined with the <h1> to <h6> tags.
<h1> defines the most important heading.
<h6> defines the least important heading
 -->
<h3 style="background-color:cadetblue;color:darkblue ;"> Hello, I am S K. Welcome to my website </h3>

<p style="background-color:lightseagreen;color:navy ;"> About Me <br> I am a CS student.I like Photography and Travelling </p>  
<p style="color: beige;"> Cheers </p>
<p>Connect here</p>
<img src="scotland.jpg" width="500" height="300" >
